[package]
name = "sisa-telemetry"
description = "OpenTelemetry for Rust services: one init() for traces, metrics and logs over OTLP, plus trace headers that carry across messaging"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["opentelemetry", "tracing", "telemetry", "observability", "otlp"]
categories = ["development-tools::debugging", "asynchronous"]

[lints]
workspace = true

[features]
default = []
# `testing::capture()`: in-memory exporters to assert on spans and metrics in tests. For
# dev-dependencies only.
testing = ["opentelemetry_sdk/testing"]

[dependencies]
# The part libraries use, re-exported from this crate's root.
sisa-telemetry-core = { workspace = true }

# The subscriber `init` installs: the log filter, the fmt layer and the OpenTelemetry layer.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }

# The SDK and the OTLP exporters, on the minor version the core pins.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
http = { workspace = true }

thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
serde_json = { workspace = true }
# The OpenTelemetry Collector the OTLP tests export to.
testcontainers = { workspace = true }

# The capture tests need the `testing` feature.
[[test]]
name = "propagation"
required-features = ["testing"]

[[test]]
name = "instrumenting"
required-features = ["testing"]

# Alone, since `clear` empties what the other tests of a process captured.
[[test]]
name = "clear"
required-features = ["testing"]

# One binary per test that calls `init`, which installs process-wide providers.
[[test]]
name = "init"

[[test]]
name = "reload"

[[test]]
name = "otlp_grpc"

[[test]]
name = "otlp_http"

[package.metadata.docs.rs]
all-features = true
# Marks each item a feature turns on, through `doc_cfg` in the crate root.
rustdoc-args = ["--cfg", "docsrs"]
