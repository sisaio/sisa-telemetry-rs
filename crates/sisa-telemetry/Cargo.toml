[package]
name = "sisa-telemetry"
description = "OpenTelemetry for Rust services: one init() for traces, metrics and logs over OTLP, plus trace headers that carry across messaging"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["opentelemetry", "tracing", "telemetry", "observability", "otlp"]
categories = ["development-tools::debugging", "asynchronous"]

[lints]
workspace = true

[features]
default = []
# `testing::capture()`: in-memory exporters to assert on spans and metrics in tests, and the check
# against the metric catalog. For dev-dependencies only.
testing = ["opentelemetry_sdk/testing", "dep:serde_json"]

# `prometheus_text()`: the metrics in the Prometheus text format, for an admin port's `/metrics`.
prometheus = ["dep:opentelemetry-prometheus", "dep:prometheus"]

[dependencies]
# The part libraries use, re-exported from this crate's root.
sisa-telemetry-core = { workspace = true }

# The subscriber `init` installs: the log filter, the fmt layer and the OpenTelemetry layer.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }

# The SDK and the OTLP exporters, on the minor version the core pins. Only this crate turns on
# logs, for `log.otlp`; the core stays on traces and metrics.
opentelemetry = { workspace = true, features = ["logs"] }
opentelemetry_sdk = { workspace = true, features = ["logs"] }
opentelemetry-otlp = { workspace = true, features = ["logs"] }
opentelemetry-appender-tracing = { workspace = true }
http = { workspace = true }
opentelemetry-prometheus = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }

thiserror = { workspace = true }
serde = { workspace = true }
# Reads `catalog/metrics.json` for `testing::Captured::check_catalog`.
serde_json = { workspace = true, optional = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
serde_json = { workspace = true }
# In-memory exporters for the unit tests of the OTLP log layer.
opentelemetry_sdk = { workspace = true, features = ["testing", "logs"] }
# The OpenTelemetry Collector the OTLP tests export to.
testcontainers = { workspace = true }

# The capture tests need the `testing` feature.
[[test]]
name = "propagation"
required-features = ["testing"]

[[test]]
name = "instrumenting"
required-features = ["testing"]

# Alone, since `clear` empties what the other tests of a process captured.
[[test]]
name = "clear"
required-features = ["testing"]

# One binary per test that calls `init`, which installs process-wide providers.
[[test]]
name = "init"

[[test]]
name = "reload"

[[test]]
name = "prometheus"
required-features = ["prometheus"]

[[test]]
name = "otlp_grpc"

[[test]]
name = "otlp_http"

[package.metadata.docs.rs]
all-features = true
# Marks each item a feature turns on, through `doc_cfg` in the crate root.
rustdoc-args = ["--cfg", "docsrs"]
