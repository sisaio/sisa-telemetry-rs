name: Bug report
description: Something doesn't work as the docs say.
type: Bug
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't open an issue: report it privately as
        [SECURITY.md](https://github.com/sisaio/sisa-telemetry-rs/blob/main/SECURITY.md) explains.
  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options:
        - sisa-telemetry
        - sisa-telemetry-core
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show it.
      render: rust
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: The error, and the service's log lines around it, the `opentelemetry` ones included. Logs can name hosts and carry header names, and this issue is public, so replace anything you don't want seen.
      render: text
  - type: input
    id: server
    attributes:
      label: Collector or backend
      description: Where the OTLP export goes, its version, and the protocol.
      placeholder: "OpenTelemetry Collector 0.149 over gRPC"
  - type: input
    id: environment
    attributes:
      label: Rust version and OS
      placeholder: "rustc 1.89.0, Linux x86_64"
    validations:
      required: true
